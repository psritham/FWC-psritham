<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <!-- Header การ์ด -->
        <div class="card-header">
            <h2>User Profile</h2>
        </div>

        <!-- Invisible Table สำหรับจัดเรียงองค์ประกอบ -->
        <table class="profile-table">
            <tr>
                <td>
                    <img src="profile01.jpg" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="login-name">Peerapat Srithamma</td>
            </tr>
            <tr>
                <td class="description">Electrical Engineer</td>
            </tr>
            <tr>
                <td class="social-icons">
                    <img src="line.png" alt="Social 1">
                    <img src="ig.avif" alt="Social 2">
                    <img src="facebook.svg" alt="Social 3">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
